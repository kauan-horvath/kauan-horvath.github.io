<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kauan Horvath | Portfolio</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 50px 20px; 
            line-height: 1.6;
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        img.banner { 
            width: 100%; 
            height: auto;
            border-radius: 8px; 
            border: 1px solid #30363d; 
            margin-bottom: 30px;
        }

        /* Hub de Perfil - Flexbox Garantido */
        .profile-hub {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: row; /* Força lado a lado no PC */
            align-items: center;
            gap: 40px;
            text-align: left;
        }

        .profile-pic {
            width: 280px; 
            height: 280px;
            border-radius: 50%;
            border: 4px solid #30363d;
            object-fit: cover;
            flex-shrink: 0;
        }

        .profile-content {
            flex-grow: 1;
            width: 100%;
        }

        h1 { 
            color: #f0f6fc; 
            margin: 0 0 15px 0;
            font-size: 2.2em;
        }

        .profile-bio {
            margin-bottom: 30px;
            font-size: 1.1em;
            color: #8b949e;
        }

        /* Botões 7/3 */
        .project-links {
            display: flex;
            flex-direction: row; /* Força lado a lado */
            gap: 15px;
            width: 100%;
        }

        .btn-primary {
            flex: 7; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background-color: #238636;
            color: white !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-linkedin {
            flex: 3; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background-color: #0a66c2;
            color: white !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-primary:hover { background-color: #2ea043; }
        .btn-linkedin:hover { background-color: #0077b5; }

        /* Mobile - Só ativa em telas realmente pequenas */
        @media (max-width: 700px) {
            .profile-hub { flex-direction: column; text-align: center; padding: 20px; }
            .project-links { flex-direction: column; }
            .profile-pic { width: 180px; height: 180px; }
            .btn-primary, .btn-linkedin { flex: none; width: 100%; }
        }

        iframe {
            border-radius: 12px;
            border: none;
            margin-top: 10px;
            background-color: transparent;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="assets/git-banner.png" alt="Banner Kauan Horvath" class="banner">
        
        <div class="profile-hub">
            <img src="assets/profile-github.png" alt="Kauan Horvath" class="profile-pic">
            
            <div class="profile-content">
                <h1>Bem-vindo ao meu Python Lab </h1>
                
                <div class="profile-bio">
                    <p>Olá, eu sou o <strong>Kauan Horvath</strong>.</p>
                    <p>Presentation Designer | focado em automação | storytelling visual.</p>
                </div>
                
                <div class="project-links">
                    <a href="https://github.com/kauan-horvath/turning-chaos-into-code" target="_blank" class="btn-primary">
                        <svg height="20" width="20" viewBox="0 0 16 16" style="fill: white; margin-right: 8px;"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
                        Turning Chaos into Code
                    </a>
                    
                    <a href="https://www.linkedin.com/in/kauanhorvath/" target="_blank" class="btn-linkedin">
                        <svg height="20" width="20" viewBox="0 0 24 24" style="fill: white; margin-right: 8px;"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                        LinkedIn
                    </a>
                </div>
            </div>
        </div>
        
        <iframe 
            src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M" 
            width="100%" 
            height="352" 
            allowfullscreen="" 
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
            loading="lazy">
        </iframe>
    </div>

</body>
</html>
