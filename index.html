<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kauan Horvath | Portfolio Experiment</title>
    <style>
      :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --border: #30363d;
        --text-main: #f0f6fc;
        --text-sub: #8b949e;
        --accent: #2ea043;
      }

      body {
        background-color: var(--bg);
        color: var(--text-main);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      /* Container que limita a largura do conteúdo e dos Widgets */
      .container {
        max-width: 900px;
        width: 95%;
        padding: 40px 0;
        position: relative; /* Necessário para os widgets nascerem aqui dentro */
        margin-bottom: 100px;
      }

      .banner-wrapper {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border);
        margin-bottom: -60px;
        z-index: 1;
        position: relative;
      }
      .banner-img {
        width: 100%;
        display: block;
      }

      .profile-hub {
        background-color: rgba(22, 27, 34, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 80px 40px 40px 40px;
        display: flex;
        gap: 40px;
        align-items: flex-start;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        margin-bottom: 20px;
      }

      .profile-pic {
        width: 220px;
        height: 220px;
        border-radius: 12px;
        border: 2px solid var(--border);
        object-fit: cover;
      }
      .profile-content {
        flex: 1;
      }
      h1 {
        font-size: 2.5em;
        margin: 0 0 10px 0;
        letter-spacing: -1px;
        background: linear-gradient(90deg, #fff, #8b949e);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .tagline {
        font-family: monospace;
        color: var(--accent);
        font-size: 0.9em;
        margin-bottom: 20px;
        display: block;
      }
      .skill-tags {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }
      .tag {
        background: #21262d;
        border: 1px solid var(--border);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8em;
        color: var(--text-sub);
      }
      .project-links {
        display: flex;
        gap: 12px;
      }
      .btn {
        padding: 12px 20px;
        border-radius: 6px;
        font-weight: 600;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.2s;
      }
      .btn-primary {
        flex: 7;
        background-color: var(--accent);
        color: white;
      }
      .btn-secondary {
        flex: 3;
        background-color: #21262d;
        border: 1px solid var(--border);
        color: var(--text-main);
      }

      /* --- WIDGETS NASCENDO DENTRO DO LIMITE --- */
      .widget-area {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-top: 10px;
      }

      .draggable-wrapper {
        position: absolute; /* Agora eles nascem em relação ao .container */
        z-index: 1000;
        touch-action: none;
      }

      /* Posições iniciais dentro dos 900px */
      #drag-spotify {
        left: 0;
      }
      #drag-concierge {
        right: 0;
        width: 60px;
      }

      .ai-concierge-btn {
        width: 60px;
        height: 60px;
        background-color: var(--accent);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        border: none;
      }

      .chat-window {
        position: fixed;
        bottom: 100px;
        right: 30px;
        width: 350px;
        height: 450px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        display: none;
        flex-direction: column;
        z-index: 1001;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      .chat-header {
        background: #1c2128;
        padding: 15px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .messages-container {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .message {
        padding: 10px;
        border-radius: 8px;
        font-size: 0.9em;
        max-width: 80%;
      }
      .ai-msg {
        background: #21262d;
        color: var(--text-main);
        align-self: flex-start;
      }
      .chat-input-area {
        padding: 15px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
      }
      .chat-input-area input {
        flex: 1;
        background: #0d1117;
        border: 1px solid var(--border);
        color: white;
        padding: 8px;
        border-radius: 4px;
        outline: none;
      }

      .drag-handle {
        height: 12px;
        background: #30363d;
        cursor: move;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 8px;
        color: var(--text-sub);
      }
    </style>
  </head>
  <body>
    <div class="container" id="main-container">
      <!-- Banner -->
      <div class="banner-wrapper">
        <a href="https://github.com/kauan-horvath" target="_blank">
          <img
            src="https://raw.githubusercontent.com/kauan-horvath/kauan-horvath/main/assets/turning-chaos-title-2.gif"
            class="banner-img"
            alt="Banner"
        /></a>
      </div>

      <!-- Perfil -->
      <main class="profile-hub">
        <a href="https://www.linkedin.com/in/kauanhorvath/" target="_blank">
          <img
            src="assets/profile-github.png"
            alt="Profile"
            class="profile-pic"
        /></a>
        <div class="profile-content">
          <span class="tagline">&lt;system_ready /&gt;</span>
          <h1>Kauan Horvath</h1>
          <div class="skill-tags">
            <span class="tag">Presentation Designer</span>
            <span class="tag">Python Automation</span>
            <span class="tag">Visual Storyteller</span>
          </div>
          <div class="project-links">
            <a
              href="https://github.com/kauan-horvath/turning-chaos-into-code"
              class="btn btn-primary"
              >Laboratory</a
            >
            <a
              href="https://www.linkedin.com/in/kauanhorvath/"
              class="btn btn-secondary"
              >LinkedIn</a
            >
          </div>
        </div>
      </main>

      <!-- Área onde os Widgets "nascem" alinhados -->
      <div class="widget-area">
        <!-- Spotify -->
        <div
          id="drag-spotify"
          class="draggable-wrapper"
          style="
            background: #1c2128;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            width: 300px;
          "
        >
          <div class="drag-handle">⠿</div>
          <iframe
            src="https://open.spotify.com/embed/playlist/679wCT6dVMDBxrYa5NcrXL"
            width="100%"
            height="80"
            frameborder="0"
            allow="encrypted-media"
          ></iframe>
        </div>

        <!-- Concierge -->
        <div id="drag-concierge" class="draggable-wrapper">
          <div
            class="drag-handle"
            style="border-radius: 10px 10px 0 0; height: 8px"
          ></div>
          <button class="ai-concierge-btn" id="open-chat">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="white">
              <path
                d="M12 2L14.5 9L22 11.5L14.5 14L12 21L9.5 14L2 11.5L9.5 9L12 2Z"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Janela de Chat (Mantida fixa à direita) -->
    <div class="chat-window" id="chat-ui">
      <div class="chat-header">
        <span style="font-size: 0.8em; font-weight: bold">CONCIERGE IA</span>
        <button
          onclick="toggleChat()"
          style="background: none; border: none; color: white; cursor: pointer"
        >
          ✕
        </button>
      </div>
      <div class="messages-container" id="messages">
        <div class="message ai-msg">
          Olá! Sou o concierge do Kauan. Como posso ajudar?
        </div>
      </div>
      <div class="chat-input-area">
        <input type="text" placeholder="Pergunte algo..." />
        <button
          style="
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
          "
        >
          &gt;
        </button>
      </div>
    </div>

    <script>
      function toggleChat() {
        const chat = document.getElementById("chat-ui");
        chat.style.display = chat.style.display === "none" ? "flex" : "none";
      }
      document
        .getElementById("open-chat")
        .addEventListener("click", toggleChat);

      function makeDraggable(el) {
        let pos1 = 0,
          pos2 = 0,
          pos3 = 0,
          pos4 = 0;
        const handle = el.querySelector(".drag-handle") || el;
        handle.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
          e.preventDefault();
          pos3 = e.clientX;
          pos4 = e.clientY;
          document.onmouseup = closeDragElement;
          document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
          e.preventDefault();
          pos1 = pos3 - e.clientX;
          pos2 = pos4 - e.clientY;
          pos3 = e.clientX;
          pos4 = e.clientY;

          // Agora ele se move livremente usando coordenadas absolutas da página
          el.style.top = el.offsetTop - pos2 + "px";
          el.style.left = el.offsetLeft - pos1 + "px";
          el.style.right = "auto";
        }

        function closeDragElement() {
          document.onmouseup = null;
          document.onmousemove = null;
        }
      }

      makeDraggable(document.getElementById("drag-spotify"));
      makeDraggable(document.getElementById("drag-concierge"));
    </script>
  </body>
</html>
